name: admafia

services:
  # 1. MongoDB 7.0 Replica Set (`rs0`) — Sole Authoritative CRM Database & Transactional Outbox
  mongo:
    image: mongo:7.0-jammy
    container_name: admafia-mongo
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - admafia-net

  # 2. Node.js Express REST API Backend (100% MongoDB / Mongoose)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: admafia-backend
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      TRUST_PROXY_HEADERS: "true"
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongo:27017/admafia_crm?directConnection=true}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
      - ./frontend/dist:/frontend/dist:ro
    networks:
      - admafia-net

  # 3. React 19 + Vite Frontend SPA (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admafia-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - admafia-net

volumes:
  mongo_data:

networks:
  admafia-net:
    driver: bridge
