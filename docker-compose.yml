name: admafia

services:
  # 1. MongoDB 7.0 Replica Set (`rs0`) — Sole Authoritative CRM Database & Transactional Outbox
  mongo:
    image: mongo:7.0-jammy
    container_name: admafia-mongo
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - admafia-net

  # 2. Redis 7 — Distributed Rate Limiting, OTP Cooldowns & Session Cache (Internal Network Only)
  redis:
    image: redis:7-alpine
    container_name: admafia-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - admafia-net

  # 3. Node.js Express REST API Backend (100% MongoDB / Mongoose + Redis + FCM + WhatsApp OTP)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: admafia-backend
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      TRUST_PROXY_HEADERS: "true"
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongo:27017/admafia_crm?directConnection=true}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      BACKUP_DIR: /backups
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
      - ./backups:/backups
    networks:
      - admafia-net

  # 4. React 19 + Vite Frontend SPA (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admafia-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - admafia-net

  # 5. Mongo Express — Live MongoDB Web Console (Bound strictly to 127.0.0.1:8081 behind Nginx /db-console/)
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: admafia-mongo-express
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: ${ME_MONGODB_URL:-mongodb://mongo:27017/?directConnection=true}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_SITE_BASEURL: /db-console/
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_ADMIN_USER:-admafia_db_admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_ADMIN_PASS:-AdMafiaLiveDB@2026!}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - admafia-net

volumes:
  mongo_data:
  redis_data:

networks:
  admafia-net:
    driver: bridge
