name: admafia

services:
  # 1. PostgreSQL 16 Relational Database
  db:
    image: postgres:16-alpine
    container_name: admafia-db
    restart: always
    environment:
      POSTGRES_DB: admafia_crm
      POSTGRES_USER: admafia_user
      POSTGRES_PASSWORD: AdMafiaStrongPass2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admafia_user -d admafia_crm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - admafia-net

  # 2. Node.js Express REST API Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: admafia-backend
    restart: always
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGUSER: admafia_user
      PGPASSWORD: AdMafiaStrongPass2026!
      PGDATABASE: admafia_crm
      NODE_ENV: production
      TRUST_PROXY_HEADERS: "true"
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-admafia_mongo}:${MONGO_INITDB_ROOT_PASSWORD:-AdMafiaMongoPass2026!}@mongo:27017/${MONGO_INITDB_DATABASE:-admafia_marketing}?authSource=admin}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - admafia-net

  # 3. React 19 + Vite Frontend SPA (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admafia-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - admafia-net

  # 4. pgAdmin 4 Web Database Administration Browser (/dbadmin/browser/)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: admafia-pgadmin
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admafia.marketing
      PGADMIN_DEFAULT_PASSWORD: AdMafiaAdmin2026!
      PGADMIN_LISTEN_PORT: 80
      SCRIPT_NAME: /dbadmin
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5055:80"
    networks:
      - admafia-net

  # 5. MongoDB 7.0 Document Database (Marketing Creative & Telemetry)
  mongo:
    image: mongo:7.0-jammy
    container_name: admafia-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admafia_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-AdMafiaMongoPass2026!}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-admafia_marketing}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - admafia-net

volumes:
  postgres_data:
  pgadmin_data:
  mongo_data:

networks:
  admafia-net:
    driver: bridge

